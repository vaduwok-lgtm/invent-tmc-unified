<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Инвентаризация ТМЦ</title>
<meta name="theme-color" content="#175CD3">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --surface:#fff;--canvas:#f7f8fa;--border:#e4e7ec;--border-light:#f2f4f7;
  --text-primary:#101828;--text-secondary:#667085;--text-tertiary:#98a2b3;
  --accent:#175cd3;--accent-hover:#1849a9;--accent-subtle:#eff4ff;
  --success:#067647;--success-subtle:#ecfdf3;--warning:#b54708;--warning-subtle:#fffaeb;
  --danger:#b42318;--danger-subtle:#fef3f2;--purple:#6941c6;--purple-subtle:#f4f3ff;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 4px 12px rgba(16,24,40,.12),0 2px 4px rgba(16,24,40,.06);
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;
  --header-h:48px;--nav-h:56px;--safe-bottom:env(safe-area-inset-bottom,0px);
  --font-sans:'Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:100ms ease;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-sans);font-size:15px;line-height:1.5;background:var(--canvas);color:var(--text-primary);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.icon{display:block;width:20px;height:20px;flex-shrink:0;color:currentColor}
.icon--logo{width:18px;height:18px}

/* HEADER */
.app-header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;z-index:10;flex-shrink:0}
.logo{width:32px;height:32px;background:var(--text-primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.header-brand{flex:1;min-width:0}
.header-title{font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.header-undo-btn,.header-reset-btn{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:none;border:none;border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;touch-action:manipulation;transition:background-color var(--ease),color var(--ease)}
.header-undo-btn:hover:not(:disabled),.header-reset-btn:hover{background:var(--border-light);color:var(--text-primary)}
.header-undo-btn:disabled{opacity:.35;cursor:not-allowed}
.header-undo-btn:focus-visible,.header-reset-btn:focus-visible,.nav-btn:focus-visible,.fab:focus-visible,.scroll-top-fab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.undo-badge{position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;font-size:9px;font-weight:600;font-variant-numeric:tabular-nums;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface)}

/* BODY */
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 84px)}

/* BOTTOM NAV */
.bottom-nav{height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;z-index:10}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;touch-action:manipulation;color:var(--text-tertiary);font-family:inherit;font-size:11px;font-weight:500;padding:6px 4px 8px;transition:color var(--ease);position:relative}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--success);color:#fff;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface)}

/* TAB VIEWS */
.tab-view{display:none}
.tab-view.active{display:block}

/* FABs */
.fab,.scroll-top-fab{position:fixed;right:16px;width:52px;height:52px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;box-shadow:var(--shadow-lg);z-index:20;display:flex;align-items:center;justify-content:center;transition:background-color var(--ease),opacity var(--ease),transform var(--ease)}
.fab{bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);font-size:28px;font-weight:300}
.fab:active{background:var(--accent-hover);transform:scale(.96)}
.scroll-top-fab{bottom:calc(var(--nav-h) + var(--safe-bottom) + 80px);background:var(--text-primary);opacity:0;pointer-events:none}
.scroll-top-fab.visible{opacity:1;pointer-events:auto}

/* LOC STRIP */
.loc-strip-wrap{background:#fff;border-bottom:1px solid var(--border);padding:10px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;display:flex;gap:8px;scrollbar-width:none}
.loc-strip-wrap::-webkit-scrollbar{display:none}
.loc-chip{flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer;touch-action:manipulation;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.loc-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.loc-chip .loc-dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:none}
.loc-chip.has-data .loc-dot{display:block}
.loc-chip.active .loc-dot{background:rgba(255,255,255,.7)}

/* STATS */
.stats-row{display:flex;gap:10px;padding:12px 12px 0}
.stat-pill{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat-pill .sp-val{font-size:20px;font-weight:700;color:var(--text-primary);line-height:1;font-variant-numeric:tabular-nums}
.stat-pill .sp-val.green{color:var(--success)}
.stat-pill .sp-val.blue{color:var(--accent)}
.stat-pill .sp-lbl{font-size:10px;color:var(--text-tertiary);margin-top:3px;font-weight:500}

/* SEARCH (inventory) */
.inv-search-wrap{padding:12px 12px 0;position:relative}
.inv-search-wrap input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px 11px 38px;font-size:15px;color:var(--text-primary);font-family:inherit}
.inv-search-wrap input:focus{outline:none;border-color:var(--accent)}
.inv-search-icon{position:absolute;left:24px;top:calc(50% + 6px);transform:translateY(-50%);color:var(--text-tertiary);pointer-events:none;display:flex}
.inv-search-clear{position:absolute;right:22px;top:calc(50% + 6px);transform:translateY(-50%);background:var(--border-light);border:none;border-radius:50%;width:24px;height:24px;color:var(--text-secondary);cursor:pointer;font-size:16px;line-height:1;display:none;align-items:center;justify-content:center}
.inv-search-clear.visible{display:flex}

/* CATEGORY STRIP */
.category-strip-wrap{display:flex;gap:8px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.category-strip-wrap::-webkit-scrollbar{display:none}
.category-chip{flex-shrink:0;padding:7px 13px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text-secondary);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.category-chip.active{color:var(--accent);border-color:var(--accent-subtle);background:var(--accent-subtle)}

/* PRODUCTS */
.products-list{padding:12px;display:flex;flex-direction:column;gap:10px}
.product-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.product-card.has-data{border-color:#bfdbfe}
.product-card.custom-product{border-color:#fed7aa}
.product-card.custom-product.has-data{border-color:#fb923c}
.product-header{display:flex;align-items:center;padding:14px 14px 14px 16px;gap:10px;cursor:pointer;touch-action:manipulation;user-select:none}
.product-indicator{width:4px;align-self:stretch;border-radius:4px;background:var(--border);flex-shrink:0;margin-left:-4px}
.product-card.has-data .product-indicator{background:var(--accent)}
.product-card.custom-product .product-indicator{background:#fed7aa}
.product-card.custom-product.has-data .product-indicator{background:var(--warning)}
.product-main{flex:1;min-width:0}
.product-name{font-size:15px;font-weight:700;color:var(--text-primary);line-height:1.3}
.product-sub{font-size:11px;color:var(--text-tertiary);margin-top:2px;font-weight:500}
.product-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.product-total{font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.product-total.zero{color:#d0d5dd}
.product-unit-tag{font-size:11px;color:var(--text-tertiary);background:var(--border-light);padding:2px 8px;border-radius:20px;font-weight:600}
.custom-tag{font-size:10px;color:var(--warning);background:var(--warning-subtle);padding:2px 8px;border-radius:20px;font-weight:700}
.product-chevron{font-size:18px;color:#d0d5dd;transition:transform .2s;flex-shrink:0}
.product-card.open .product-chevron{transform:rotate(180deg)}
.product-body{display:none;border-top:1px solid var(--border-light);padding:12px;background:var(--canvas)}
.product-card.open .product-body{display:block}

/* UNIT BLOCK */
.unit-block{margin-bottom:10px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.unit-block:last-of-type{margin-bottom:0}
.unit-block-header{padding:8px 12px;background:var(--canvas);border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;gap:8px}
.unit-name{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.unit-subtotal{font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.unit-rows{padding:8px;display:flex;flex-direction:column;gap:6px}

/* ROW */
.row-item{display:flex;align-items:center;gap:6px}
.row-num{width:20px;text-align:center;font-size:11px;color:var(--text-tertiary);font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
.vc{flex:1;display:flex;align-items:center;background:var(--border-light);border-radius:10px;overflow:hidden;border:1px solid var(--border);height:48px;min-width:0}
.vc-btn{width:44px;height:48px;flex-shrink:0;background:transparent;border:none;font-size:26px;font-weight:300;color:var(--text-secondary);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;transition:background .1s}
.vc-btn:active{background:var(--accent);color:#fff}
.vc-input{flex:1;text-align:center;font-size:18px;font-weight:700;background:#fff;border:none;color:var(--text-primary);padding:0 4px;height:100%;min-width:0;font-variant-numeric:tabular-nums;font-family:inherit}
.vc-input:focus{outline:none}
.vc-input::placeholder{color:#d0d5dd;font-weight:400}
.row-actions{display:flex;gap:4px;flex-shrink:0}
.row-action-btn{width:38px;height:48px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:18px;font-weight:bold;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all .1s}
.row-action-btn:active{background:var(--border)}
.row-action-btn.del{background:var(--danger-subtle);color:var(--danger);border-color:#fecaca}
.row-action-btn.del:active{background:#fecaca}

/* FOOTER BUTTONS */
.product-footer{padding:10px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.add-custom-btn,.clear-product-btn,.delete-product-btn{flex:1;min-width:120px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px dashed #d0d5dd;background:transparent;color:var(--text-secondary);cursor:pointer;touch-action:manipulation;text-align:center;font-family:inherit}
.add-custom-btn:active{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent);border-style:solid}
.clear-product-btn{border-color:#fecaca;color:var(--danger)}
.clear-product-btn:active{background:var(--danger-subtle)}
.delete-product-btn{border-color:#fed7aa;color:var(--warning);border-style:solid;background:var(--warning-subtle)}
.delete-product-btn:active{background:#fed7aa}

/* CUSTOM FORM */
.custom-form{margin:10px 0 0;background:var(--accent-subtle);border:1px solid #bfdbfe;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.custom-form-title{font-size:13px;font-weight:700;color:var(--accent)}
.custom-form input{background:#fff;border:1px solid #bfdbfe;padding:10px 12px;border-radius:10px;color:var(--text-primary);font-size:14px;width:100%;font-family:inherit}
.custom-form input:focus{outline:2px solid var(--accent)}
.custom-form-btns{display:flex;gap:8px}
.custom-form-btns button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;touch-action:manipulation;font-family:inherit}
.cf-save{background:var(--accent);color:#fff}
.cf-cancel{background:var(--border-light);color:var(--text-secondary)}

/* ADD PRODUCT FORM */
.add-product-form{margin:0 0 12px;background:var(--warning-subtle);border:1px solid #fed7aa;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.add-product-form-title{font-size:14px;font-weight:700;color:var(--warning)}
.add-product-form input,.add-product-form select{background:#fff;border:1px solid #fed7aa;padding:12px;border-radius:10px;color:var(--text-primary);font-size:15px;width:100%;font-family:inherit}
.add-product-form input:focus,.add-product-form select:focus{outline:2px solid var(--warning)}
.add-product-form-btns{display:flex;gap:8px}
.add-product-form-btns button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;touch-action:manipulation;font-family:inherit}
.apf-save{background:var(--warning);color:#fff}
.apf-cancel{background:var(--border-light);color:var(--text-secondary)}
.add-product-btn{margin:0 12px 4px;padding:14px;border-radius:14px;font-size:14px;font-weight:700;border:2px dashed #fed7aa;background:var(--warning-subtle);color:var(--warning);cursor:pointer;touch-action:manipulation;text-align:center;width:calc(100% - 24px);display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.add-product-btn:active{background:#fed7aa}

.clear-loc-btn{margin:8px 12px 12px;width:calc(100% - 24px);padding:14px;background:var(--danger-subtle);border:1.5px solid #fecaca;border-radius:12px;font-size:14px;font-weight:700;color:var(--danger);cursor:pointer;touch-action:manipulation;text-align:center;font-family:inherit}
.clear-loc-btn:active{background:#fecaca}

.empty-state{text-align:center;padding:48px 24px;color:var(--text-tertiary)}
.empty-state .ei{font-size:52px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* SUMMARY */
.summary-header{padding:16px 16px 12px}
.summary-header h2{font-size:18px;font-weight:700}
.summary-header p{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.ss-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px}
.ss-card .ss-val{font-size:26px;font-weight:700;color:var(--text-primary);line-height:1;font-variant-numeric:tabular-nums}
.ss-card .ss-val.green{color:var(--success)}
.ss-card .ss-val.blue{color:var(--accent)}
.ss-card .ss-lbl{font-size:12px;color:var(--text-tertiary);margin-top:4px;font-weight:500}
.search-wrap{padding:0 16px 12px;position:relative}
.search-wrap input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 16px 12px 40px;font-size:15px;color:var(--text-primary);font-family:inherit}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);pointer-events:none;display:flex}
.filter-row{padding:0 16px 12px;display:flex;gap:8px}
.filter-chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer;touch-action:manipulation;transition:all .15s;font-family:inherit}
.filter-chip.active{background:var(--accent-subtle);border-color:var(--accent);color:var(--accent)}
.summary-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.sum-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:flex-start;gap:10px}
.sum-item.zero{opacity:.5}
.sum-item.custom{border-color:#fed7aa}
.sum-item-left{flex:1;min-width:0}
.sum-item-name{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.sum-item-detail{font-size:11px;color:var(--text-tertiary);line-height:1.5}
.sum-item-right{text-align:right;flex-shrink:0}
.sum-item-val{font-size:20px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.sum-item-val.zero{color:#d0d5dd}
.sum-item-unit{font-size:11px;color:var(--text-tertiary);font-weight:600;margin-top:3px}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 88px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--text-primary);color:#fff;padding:10px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;opacity:0;transition:opacity .15s ease,transform .15s ease;z-index:1000;max-width:calc(100% - 32px);text-align:center;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .15s ease}
.confirm-overlay.show{opacity:1;pointer-events:auto}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;width:100%;max-width:320px;box-shadow:var(--shadow-lg)}
.confirm-msg{font-size:15px;font-weight:500;color:var(--text-primary);line-height:1.5;margin-bottom:16px}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;padding:10px 12px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;border:none;cursor:pointer;touch-action:manipulation}
.confirm-cancel{background:var(--border-light);color:var(--text-secondary)}
.confirm-ok{background:var(--danger);color:#fff}
.confirm-btns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* LOCATION MULTISELECT */
.loc-multi{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.loc-multi label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text-secondary);background:#fff;border:1px solid var(--border);border-radius:20px;padding:5px 10px;cursor:pointer}
.loc-multi input{width:14px;height:14px;accent-color:var(--accent)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.suite-back-link{position:relative;z-index:2;align-self:flex-start;margin:8px 12px 0;padding:8px 12px;border:1px solid var(--border,#e4e7ec);border-radius:12px;background:rgba(255,255,255,.94);color:var(--text-secondary,#667085);font-size:12px;line-height:1.2;font-weight:600;font-family:inherit;text-decoration:none;box-shadow:0 2px 8px rgba(16,24,40,.08);backdrop-filter:blur(8px)}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo" aria-hidden="true">
    <svg class="icon icon--logo" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
  </div>
  <div class="header-brand"><div class="header-title">Инвентаризация ТМЦ</div></div>
  <div class="header-actions">
    <button class="header-undo-btn" id="undoBtn" type="button" title="Отменить последнее действие" aria-label="Отменить последнее действие" disabled>
      <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M6.5 7H3.5V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10a5.5 5.5 0 1 0 1.1-3.3L3.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="undo-badge" id="undoBadge" style="display:none;"></span>

/* ═══════════════════════════════════════
   STORAGE
═══════════════════════════════════════ */
function getRows(loc,pid,uIdx){ const r=localStorage.getItem(`inv_${loc}_${pid}_${uIdx}`); return r?JSON.parse(r):[null]; }
function setRows(loc,pid,uIdx,rows){ localStorage.setItem(`inv_${loc}_${pid}_${uIdx}`, JSON.stringify(rows)); }
function getCU(loc,pid){ const r=localStorage.getItem(`cu_${loc}_${pid}`); return r?JSON.parse(r):[]; }
function setCU(loc,pid,cu){ localStorage.setItem(`cu_${loc}_${pid}`, JSON.stringify(cu)); }
function getCustomProducts(loc){ const r=localStorage.getItem(`cprods_${loc}`); return r?JSON.parse(r):[]; }
function setCustomProducts(loc,arr){ localStorage.setItem(`cprods_${loc}`, JSON.stringify(arr)); }
function genId(){ return 'cp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

const NQ_PREFIX = 'nq_';
function nqLocsKey(code){ return NQ_PREFIX+'locs_'+code; }
function nqRowsKey(code,loc,uIdx){ return NQ_PREFIX+loc+'_'+code+'_'+uIdx; }
function getNqLocs(code){ const r=localStorage.getItem(nqLocsKey(code)); if(r) return JSON.parse(r); return ['На станции']; }
function setNqLocs(code,arr){ localStorage.setItem(nqLocsKey(code), JSON.stringify(arr)); }
function getNqRows(code,loc,uIdx){ const r=localStorage.getItem(nqRowsKey(code,loc,uIdx)); return r?JSON.parse(r):[null]; }
function setNqRows(code,loc,uIdx,rows){ localStorage.setItem(nqRowsKey(code,loc,uIdx), JSON.stringify(rows)); }

/* ═══════════════════════════════════════
   ХЕЛПЕРЫ
═══════════════════════════════════════ */
function getOldLocs(pid){
  return locations.filter(loc => (locationRules[loc] && locationRules[loc][pid]) || getCU(loc,pid).length>0);
}
function isEmbeddedOld(pid){ return !!EXCEL_TO_OLD[pid]; }
function findProduct(pid){
  const p = stdProducts.find(x=>x.id===pid);
  if(p) return {kind:'old', id:p.id, name:p.name, baseUnit:p.baseUnit};
  const n = NOMENCLATURE.find(x=>x.code===pid);
  if(n) return {kind:'new', code:n.code, name:n.name, baseUnit:n.unit, units:n.units};
  return null;
}

/* ═══════════════════════════════════════
   CALC
═══════════════════════════════════════ */
function getOldLocTotal(loc,pid){
  const cps = getCustomProducts(loc);
  const cp = cps.find(p=>p.id===pid);
  if(cp){
    let t=0;
    (cp.rows||[null]).forEach(v=>{ t += v==null||v==='' ? 0 : parseFloat(v); });
    (cp.customUnits||[]).forEach(cu=>{ (cu.rows||[null]).forEach(v=>{ t += (v==null||v===''?0:parseFloat(v))*cu.coefficient; }); });
    return t;
  }
  let t=0;
  const rules = locationRules[loc]?.[pid];
  if(rules) rules.forEach((u,i)=>getRows(loc,pid,i).forEach(v=>{ t += u.toBase(v==null||v===''?0:parseFloat(v)); }));
  getCU(loc,pid).forEach(cu=>cu.rows.forEach(v=>{ t += (v==null||v===''?0:parseFloat(v))*cu.coefficient; }));
  return t;
}
function getNewLocTotal(loc,code){
  const n = NOMENCLATURE.find(x=>x.code===code);
  if(!n) return 0;
  if(!getNqLocs(code).includes(loc)) return 0;
  let t=0;
  getNqRows(code,loc,0).forEach(v=>{ t += v==null||v===''?0:parseFloat(v); });
  (n.units||[]).forEach((u,i)=>{
    getNqRows(code,loc,i+1).forEach(v=>{ t += (v==null||v===''?0:parseFloat(v))*u[1]; });
  });
  return t;
}
function getLocTotal(loc,pid){
  const f = findProduct(pid);
  if(!f) return 0;
  return f.kind==='old' ? getOldLocTotal(loc,pid) : getNewLocTotal(loc,pid);
}
function fmt(baseUnit,val){
  const rounded = Math.round((val+Number.EPSILON)*100)/100;
  return baseUnit==='шт' ? Math.round(rounded) : rounded;
}
function getStep(label, isBase){
  const l = (label||'').toLowerCase().trim();
  if(isBase && (l === 'кг' || l === 'л')) return 0.1;
  return 1;
}
function rnd(v,s){ return Math.round((v+Number.EPSILON)*100)/100; }

/* ═══════════════════════════════════════
   UNDO
═══════════════════════════════════════ */
const UNDO_KEY = '__undo_stack__';
const MAX_UNDO = 10;
function getAppDataKeys(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && (k.startsWith('inv_')||k.startsWith('cu_')||k.startsWith('cprods_')||k.startsWith('nq_'))) keys.push(k);
  }
  return keys;
}
function snapshotAppData(){ const snap={}; getAppDataKeys().forEach(k=>{ snap[k]=localStorage.getItem(k); }); return snap; }
function pushUndoSnapshot(label){
  try{
    const stack=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');
    stack.push({label:label||'', data:snapshotAppData()});
    while(stack.length>MAX_UNDO) stack.shift();
    localStorage.setItem(UNDO_KEY, JSON.stringify(stack));
  }catch(e){ console.error('undo snapshot', e); }
  updateUndoButton();
}
function undoLastAction(){
  let stack;
  try{ stack=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]'); }catch(e){ stack=[]; }
  if(!stack.length){ toast('Нечего отменять'); return; }
  const last=stack.pop();
  localStorage.setItem(UNDO_KEY, JSON.stringify(stack));
  getAppDataKeys().forEach(k=>localStorage.removeItem(k));
  Object.keys(last.data).forEach(k=>localStorage.setItem(k,last.data[k]));
  renderLocStrip(); renderStats(); renderCategoryStrip(); renderProducts(); updateNavBadge();
  document.getElementById('addProductFormWrap').innerHTML='';
  if(document.getElementById('tabSummary').classList.contains('active')) renderSummary();
  updateUndoButton();
  toast(last.label ? `↩️ Отменено: ${last.label}` : '↩️ Действие отменено');
}
function updateUndoButton(){
  let stack;
  try{ stack=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]'); }catch(e){ stack=[]; }
  const btn=document.getElementById('undoBtn');
  const badge=document.getElementById('undoBadge');
  if(!btn) return;
  btn.disabled = stack.length===0;
  if(badge){
    if(stack.length>0){ badge.style.display='flex'; badge.textContent=stack.length; }
    else badge.style.display='none';
  }
}

function toast(msg){

  setTimeout(()=>t.classList.remove('show'),2200);
}
let _confirmCallback=null;
function showConfirm(msg,onOk){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmOverlay').classList.add('show');
  _confirmCallback=onOk;
}
function hideConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');

}

/* ═══════════════════════════════════════
   BADGE
═══════════════════════════════════════ */
function updateNavBadge(){
  let filled = 0;
  stdProducts.forEach(p=>{ if(locations.some(loc=>getOldLocTotal(loc,p.id)>0)) filled++; });
  NOMENCLATURE.forEach(n=>{
    if(OLD_TO_EXCEL[n.code]) return;
    if(locations.some(loc=>getNewLocTotal(loc,n.code)>0)) filled++;
  });
  locations.forEach(loc=>{ getCustomProducts(loc).forEach(cp=>{ if(getOldLocTotal(loc,cp.id)>0) filled++; }); });
  const badge=document.getElementById('navBadge');
  badge.style.display = filled>0?'flex':'none';
  badge.textContent = filled;
}

/* ═══════════════════════════════════════
   LOC STRIP
═══════════════════════════════════════ */
function renderLocStrip(){
  const c=document.getElementById('locStrip');
  c.innerHTML='';
  locations.forEach((loc,i)=>{
    const chip=document.createElement('div');
    chip.className='loc-chip'+(i===currentLocIdx?' active':'');
    chip.id=`locchip_${i}`;
    if(hasLocData(loc)) chip.classList.add('has-data');
    chip.innerHTML=`<span class="loc-dot"></span>${loc}`;
    chip.onclick=()=>switchLocation(i);
    c.appendChild(chip);
  });
}
function hasLocData(loc){
  if(Object.keys(locationRules[loc]||{}).some(pid=>getOldLocTotal(loc,pid)>0)) return true;
  if(getCustomProducts(loc).some(cp=>getOldLocTotal(loc,cp.id)>0)) return true;
  if(NOMENCLATURE.some(n=>getNewLocTotal(loc,n.code)>0)) return true;
  return false;
}
function updateLocChipData(locIdx){
  const chip=document.getElementById(`locchip_${locIdx}`);
  if(!chip) return;
  chip.classList.toggle('has-data', hasLocData(locations[locIdx]));
}

/* ═══════════════════════════════════════
   STATS
═══════════════════════════════════════ */
function renderStats(){
  const newList = NOMENCLATURE.filter(n=>{
    if(OLD_TO_EXCEL[n.code]) return false;
    return getNqLocs(n.code).includes(currentLoc);
  });
  const oldPidsInLoc = new Set();
  stdProducts.forEach(p=>{
    if(!getOldLocs(p.id).includes(currentLoc)) return;
    oldPidsInLoc.add(p.id);
  });
  const cpList = getCustomProducts(currentLoc);
  const total = newList.length + oldPidsInLoc.size + cpList.length;
  const filled =
    newList.filter(n=>getNewLocTotal(currentLoc,n.code)>0).length +
    [...oldPidsInLoc].filter(pid=>getOldLocTotal(currentLoc,pid)>0).length +
    cpList.filter(cp=>getOldLocTotal(currentLoc,cp.id)>0).length;
  const pct = total>0 ? Math.round(filled/total*100) : 0;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stFilled').textContent = filled;
  document.getElementById('stPct').textContent = pct+'%';
}

   SWITCH LOCATION
═══════════════════════════════════════ */
function switchLocation(idx){
  currentLocIdx=idx; currentLoc=locations[idx];
  renderLocStrip();
  const active=document.getElementById(`locchip_${idx}`);
  if(active) active.scrollIntoView({block:'nearest',inline:'center'});
  renderStats(); renderCategoryStrip(); renderProducts();
  document.getElementById('addProductFormWrap').innerHTML='';
}

/* ═══════════════════════════════════════
   SEARCH
═══════════════════════════════════════ */
function matchesSearch(p){
  if(!invSearchQ) return true;
  const q=invSearchQ.toLowerCase();
  const name=(p.name||'').toLowerCase();
  const cat=(p.category||'').toLowerCase();
  const code=(p.code||p.id||'').toLowerCase();
  return name.includes(q)||cat.includes(q)||code.includes(q);
}

/* ═══════════════════════════════════════
   RENDER PRODUCTS
═══════════════════════════════════════ */
function renderProducts(){
  const container=document.getElementById('productsList');
  container.innerHTML='';

  // 1. Строго по порядку NOMENCLATURE
  NOMENCLATURE.forEach(n=>{
    const oldId = OLD_TO_EXCEL[n.code];
    const locs = oldId ? getOldLocs(oldId) : getNqLocs(n.code);
    if(!locs.includes(currentLoc)) return;

    if(currentCategory!=='all'){
      const catKey = oldId ? productCategory(oldId) : n.group;
      if(catKey!==currentCategory) return;
    }
    if(!matchesSearch({name:n.name, category:n.cat, code:n.code})) return;

    if(oldId){
      const product=stdProducts.find(p=>p.id===oldId);
      if(!product) return;
      container.appendChild(buildStdProductCard(product, locationRules[currentLoc]?.[oldId]||[], n));
    } else {
      container.appendChild(buildNewProductCard(n));
    }
  });

  // 2. Хвост: старые, которых нет в Excel
  const mappedOld = new Set(Object.values(OLD_TO_EXCEL));
  stdProducts.forEach(p=>{
    if(mappedOld.has(p.id)) return;
    if(!getOldLocs(p.id).includes(currentLoc)) return;
    const cat=productCategory(p.id);
    if(currentCategory!=='all' && cat!==currentCategory) return;
    if(!matchesSearch({name:p.name, category:cat, id:p.id})) return;
    container.appendChild(buildStdProductCard(p, locationRules[currentLoc]?.[p.id]||[]));
  });

  // 3. Кастомные
  if(currentCategory==='all'){
    getCustomProducts(currentLoc).forEach(cp=>{
      if(!matchesSearch({name:cp.name, category:'', id:cp.id})) return;
      container.appendChild(buildCustomProductCard(cp));
    });
  }

  if(!container.children.length){
    container.innerHTML=`<div class="empty-state"><div class="ei">🔍</div><p>Ничего не найдено</p></div>`;
  }
}

/* ═══════════════════════════════════════
   CATEGORY STRIP
═══════════════════════════════════════ */
function renderCategoryStrip(){
  const strip=document.getElementById('categoryStrip');
  const groupsInLoc=new Set();
  NOMENCLATURE.forEach(n=>{
    const oldId=OLD_TO_EXCEL[n.code];
    const locs=oldId?getOldLocs(oldId):getNqLocs(n.code);
    if(locs.includes(currentLoc)) groupsInLoc.add(n.group);
  });

  const mappedOld=new Set(Object.values(OLD_TO_EXCEL));
  const tailCats=new Set();
  stdProducts.forEach(p=>{
    if(mappedOld.has(p.id)) return;
    if(!getOldLocs(p.id).includes(currentLoc)) return;
    tailCats.add(productCategory(p.id));
  });

  const chips=[{key:'all',label:'Все'}];
  Object.keys(NOMENCLATURE_GROUPS).forEach(g=>{
    if(groupsInLoc.has(g)) chips.push({key:g, label:NOMENCLATURE_GROUPS[g]});
  });
  const oldLabels={chicken:'Курица (старые)',potato:'Картофель (старые)',mixes:'Смеси (старые)',pantry:'Бакалея (старые)',beer:'Пиво / тара (старые)',containers:'Тара (старые)'};
  Object.keys(PRODUCT_CATEGORIES).forEach(k=>{
    if(tailCats.has(k)) chips.push({key:k, label:oldLabels[k]||PRODUCT_CATEGORIES[k].label});
  });

  if(currentCategory!=='all' && !chips.some(c=>c.key===currentCategory)) currentCategory='all';
  strip.innerHTML='';
  chips.forEach(c=>{
    const chip=document.createElement('button');
    chip.type='button';
    chip.className='category-chip'+(c.key===currentCategory?' active':'');
    chip.textContent=c.label;
    chip.onclick=()=>{ currentCategory=c.key; renderCategoryStrip(); renderProducts(); };
    strip.appendChild(chip);
  });
}

/* ═══════════════════════════════════════
   СТАРАЯ КАРТОЧКА
═══════════════════════════════════════ */
function buildStdProductCard(product, unitRules, excelMeta){
  const pid=product.id;
  const totalVal=fmt(product.baseUnit, getOldLocTotal(currentLoc,pid));
  const hasData=totalVal>0;
  const card=document.createElement('div');
  card.className='product-card '+(hasData?'has-data':'');
  card.id=`pcard_${pid}`;

  const displayName = excelMeta ? excelMeta.name : product.name;
  const displaySub = excelMeta ? `${excelMeta.cat} · ${excelMeta.code}` : 'Старая номенклатура';

  const header=document.createElement('div');
  header.className='product-header';
  header.innerHTML=`
    <div class="product-indicator"></div>
    <div class="product-main">
      <div class="product-name">${displayName}</div>
      <div class="product-sub">${displaySub}</div>
    </div>
    <div class="product-meta">
      <div class="product-total ${hasData?'':'zero'}" id="ptotal_${pid}">${totalVal}</div>
      <div class="product-unit-tag">${product.baseUnit}</div>
    </div>
    <div class="product-chevron">⌄</div>`;
  header.onclick=()=>card.classList.toggle('open');
  card.appendChild(header);

  const body=document.createElement('div');
  body.className='product-body';
  unitRules.forEach((unit,uIdx)=>{ body.appendChild(buildUnitBlock(currentLoc,pid,uIdx,unit.label,false,null,product.baseUnit)); });
  getCU(currentLoc,pid).forEach((cu,cuIdx)=>{ body.appendChild(buildUnitBlock(currentLoc,pid,cuIdx,cu.label,true,cu.coefficient,product.baseUnit)); });

  const footer=document.createElement('div');
  footer.className='product-footer';
  const addBtn=document.createElement('button');
  addBtn.className='add-custom-btn';
  addBtn.textContent='➕ Своя единица';
  addBtn.onclick=()=>toggleCustomUnitForm(body,currentLoc,pid,false);
  const clrBtn=document.createElement('button');
  clrBtn.className='clear-product-btn';
  clrBtn.textContent='🗑 Очистить';
  clrBtn.onclick=()=>{
    showConfirm(`Очистить "${displayName}"?`,()=>{
      pushUndoSnapshot(`Очистка «${displayName}»`);
      unitRules.forEach((_,uIdx)=>setRows(currentLoc,pid,uIdx,[null]));
      setCU(currentLoc,pid,[]);
      refreshStdCard(pid,product,unitRules);
    });
  };
  footer.appendChild(addBtn); footer.appendChild(clrBtn);
  body.appendChild(footer); card.appendChild(body);
  return card;
}

/* ═══════════════════════════════════════
   НОВАЯ КАРТОЧКА
═══════════════════════════════════════ */
function buildNewProductCard(n){
  const code_=n.code;
  const totalVal=fmt(n.unit, getNewLocTotal(currentLoc, code_));
  const hasData=totalVal>0;
  const card=document.createElement('div');
  card.className='product-card '+(hasData?'has-data':'');
  card.id=`pcard_${code_}`;

  const header=document.createElement('div');
  header.className='product-header';
  header.innerHTML=`
    <div class="product-indicator"></div>
    <div class="product-main">
      <div class="product-name">${n.name}</div>
      <div class="product-sub">${n.cat} · ${n.code}</div>
    </div>
    <div class="product-meta">
      <div class="product-total ${hasData?'':'zero'}" id="ptotal_${code_}">${totalVal}</div>
      <div class="product-unit-tag">${n.unit}</div>
    </div>
    <div class="product-chevron">⌄</div>`;
  header.onclick=()=>card.classList.toggle('open');
  card.appendChild(header);

  const body=document.createElement('div');
  body.className='product-body';
  body.appendChild(buildNewUnitBlock(n, 0, n.unit));
  (n.units||[]).forEach((u,i)=>{ body.appendChild(buildNewUnitBlock(n, i+1, u[0])); });

  const locsBlock=document.createElement('div');
  locsBlock.className='custom-form';
  locsBlock.style.background='var(--border-light)';
  locsBlock.style.borderColor='var(--border)';
  locsBlock.innerHTML=`<div class="custom-form-title" style="color:var(--text-secondary);font-size:12px;">📍 Помещения для этой позиции</div>`;
  const locsWrap=document.createElement('div');
  locsWrap.className='loc-multi';
  const currentLocs=getNqLocs(code_);
  locations.forEach(loc=>{
    const lbl=document.createElement('label');
    const cb=document.createElement('input');
    cb.type='checkbox';
    cb.checked=currentLocs.includes(loc);
    cb.onchange=()=>{
      let arr=getNqLocs(code_);
      if(cb.checked){ if(!arr.includes(loc)) arr.push(loc); }
      else { arr=arr.filter(x=>x!==loc); }
      if(arr.length===0) arr=['На станции'];
      setNqLocs(code_, arr);
      renderLocStrip(); renderStats(); updateNavBadge();
      if(document.getElementById('tabSummary').classList.contains('active')) renderSummary();
    };
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' '+loc));
    locsWrap.appendChild(lbl);
  });
  locsBlock.appendChild(locsWrap);
  body.appendChild(locsBlock);

  const footer=document.createElement('div');
  footer.className='product-footer';
  const clrBtn=document.createElement('button');
  clrBtn.className='clear-product-btn';
  clrBtn.textContent='🗑 Очистить';
  clrBtn.onclick=()=>{
    showConfirm(`Очистить "${n.name}"?`,()=>{
      pushUndoSnapshot(`Очистка «${n.name}»`);
      setNqRows(code_, currentLoc, 0, [null]);
      (n.units||[]).forEach((_,i)=>setNqRows(code_, currentLoc, i+1, [null]));
      refreshNewCard(code_);
    });
  };

  body.appendChild(footer);

  card.appendChild(body);
  return card;
}

function buildNewUnitBlock(n, uIdx, label){
  const code_=n.code;
  const s=getStep(label, uIdx === 0);
  const block=document.createElement('div');
  block.className='unit-block';
  const bHeader=document.createElement('div');
  bHeader.className='unit-block-header';
  const nameEl=document.createElement('div');
  nameEl.className='unit-name';
  nameEl.textContent=label;
  const subEl=document.createElement('div');
  subEl.className='unit-subtotal';
  subEl.id=`nqust_${code_}_${uIdx}`;
  bHeader.appendChild(nameEl); bHeader.appendChild(subEl);
  block.appendChild(bHeader);

  const rowsWrap=document.createElement('div');
  rowsWrap.className='unit-rows';
  block.appendChild(rowsWrap);

  function coef(){
    if(uIdx===0) return 1;
    const u=n.units[uIdx-1];
    return u ? u[1] : 1;
  }

  function refreshRows(){
    const data=getNqRows(code_, currentLoc, uIdx);
    rowsWrap.innerHTML='';
    let sub=0;
    data.forEach((val,i)=>{
      const v=val==null||val===''?0:parseFloat(val);
      sub += v*coef();
      const row=makeRowDOM(val, s,
        (nv)=>{
          let r=getNqRows(code_, currentLoc, uIdx);
          r[i]=nv;
          setNqRows(code_, currentLoc, uIdx, r);
          updateNewSubtotal(code_, uIdx, n);
          updateNewCardTotal(code_, n.unit);
          updateNavBadge();
          if(document.getElementById('tabSummary').classList.contains('active')) renderSummary();
        },
        ()=>{
          let r=getNqRows(code_, currentLoc, uIdx);
          r.push(null);
          setNqRows(code_, currentLoc, uIdx, r);
          refreshRows();
        },
        ()=>{
          let r=getNqRows(code_, currentLoc, uIdx);
          if(r.length===1) r=[null]; else r.splice(i,1);
          setNqRows(code_, currentLoc, uIdx, r);
          refreshRows();
          updateNewSubtotal(code_, uIdx, n);
          updateNewCardTotal(code_, n.unit);
          updateNavBadge();
        },
        i
      );
      rowsWrap.appendChild(row);
    });
    const el=document.getElementById(`nqust_${code_}_${uIdx}`);
    if(el) el.textContent = sub>0 ? `= ${fmt(n.unit, sub)}` : '';
  }
  refreshRows();
  return block;
}

      const v=val==null||val===''?0:parseFloat(val);
      sub += isCustom ? v*coef : (locationRules[loc]?.[pid]?.[idx]?.toBase(v)||0);

        (nv)=>{
          if(isCustom){ let cu=getCU(loc,pid); if(cu[idx]){ cu[idx].rows[i]=nv; setCU(loc,pid,cu); } }
          else { let r=getRows(loc,pid,idx); r[i]=nv; setRows(loc,pid,idx,r); }

          updateCardTotal(pid,baseUnit); updateNavBadge();

          else { let r=getRows(loc,pid,idx); if(r.length===1)r=[null]; else r.splice(i,1); setRows(loc,pid,idx,r); }
          refreshRows(); updateSubtotal(loc,pid,idx,isCustom,coef);

  refreshRows();
  return block;
}

/* ═══════════════════════════════════════
   ФАБРИКА СТРОКИ
═══════════════════════════════════════ */
function makeRowDOM(val,s,onSave,onAdd,onRemove,rowIdx){
  const row=document.createElement('div');
  row.className='row-item';
  const num=document.createElement('span');
  num.className='row-num';
  num.textContent=rowIdx+1;
  const vc=document.createElement('div');
  vc.className='vc';
  const dec=document.createElement('button');
  dec.className='vc-btn'; dec.textContent='−';
  const inp=document.createElement('input');
  inp.className='vc-input'; inp.type='number'; inp.inputMode='decimal';
  inp.step=s; inp.min=0; inp.placeholder='0';
  inp.value = val==null||val==='' ? '' : val;
  const inc=document.createElement('button');
  inc.className='vc-btn'; inc.textContent='+';
  vc.appendChild(dec); vc.appendChild(inp); vc.appendChild(inc);
  const acts=document.createElement('div');
  acts.className='row-actions';
  const addRow=document.createElement('button');
  addRow.className='row-action-btn'; addRow.textContent='+';
  const delRow=document.createElement('button');
  delRow.className='row-action-btn del'; delRow.textContent='−';
  acts.appendChild(addRow); acts.appendChild(delRow);
  row.appendChild(num); row.appendChild(vc); row.appendChild(acts);
  const save=()=>{
    let nv = inp.value==='' ? null : rnd(Math.max(0, parseFloat(inp.value)||0), s);
    if(nv!==null) inp.value=nv;
    onSave(nv);
  };
  inp.addEventListener('change',save);
  inp.addEventListener('blur',save);
  dec.addEventListener('click',()=>{ let v=inp.value===''?0:parseFloat(inp.value)||0; inp.value=rnd(Math.max(0,v-s),s); save(); });
  inc.addEventListener('click',()=>{ let v=inp.value===''?0:parseFloat(inp.value)||0; inp.value=rnd(v+s,s); save(); });
  addRow.addEventListener('click',onAdd);
  delRow.addEventListener('click',onRemove);
  return row;
}

function updateSubtotal(loc,pid,idx,isCustom,coef){
  const data = isCustom ? (getCU(loc,pid)[idx]?.rows||[null]) : getRows(loc,pid,idx);
  let t=0;
  data.forEach(v=>{ const n=v==null||v===''?0:parseFloat(v); t += isCustom ? n*coef : (locationRules[loc]?.[pid]?.[idx]?.toBase(n)||0); });
  const el=document.getElementById(`ust_${loc}_${pid}_${idx}_${isCustom?'c':'s'}`);
  const product=stdProducts.find(p=>p.id===pid);
  if(el) el.textContent = t>0 ? `= ${fmt(product?.baseUnit||'шт', t)}` : '';
}
function updateCardTotal(pid,baseUnit){
  const el=document.getElementById(`ptotal_${pid}`);
  const card=document.getElementById(`pcard_${pid}`);
  if(!el||!card) return;
  const val=fmt(baseUnit, getOldLocTotal(currentLoc,pid));
  el.textContent=val;
  el.className='product-total'+(val>0?'':' zero');
  card.classList.toggle('has-data', val>0);
  updateLocChipData(currentLocIdx); renderStats();
}
function updateCPSubtotal(pid,key,baseUnit){
  const cps=getCustomProducts(currentLoc);
  const cp=cps.find(p=>p.id===pid);
  if(!cp) return;
  const data=cp.rows||[null];

  data.forEach(v=>{ t += v==null||v===''?0:parseFloat(v); });
  const el=document.getElementById(`cpust_${pid}_${key}`);

function updateCPCardTotal(pid,baseUnit){
  const el=document.getElementById(`ptotal_${pid}`);
  const card=document.getElementById(`pcard_${pid}`);
  if(!el||!card) return;
  const val=fmt(baseUnit, getOldLocTotal(currentLoc,pid));
  el.textContent=val;
  el.className='product-total'+(val>0?'':' zero');
  card.classList.toggle('has-data', val>0);
  updateLocChipData(currentLocIdx); renderStats();
}
function updateNewSubtotal(code_,uIdx,n){
  let t=0;
  if(uIdx===0){
    getNqRows(code_, currentLoc, 0).forEach(v=>{ t += v==null||v===''?0:parseFloat(v); });
  } else {
    const coef = n.units[uIdx-1]?.[1]||1;
    getNqRows(code_, currentLoc, uIdx).forEach(v=>{ t += (v==null||v===''?0:parseFloat(v))*coef; });
  }
  const el=document.getElementById(`nqust_${code_}_${uIdx}`);
  if(el) el.textContent = t>0 ? `= ${fmt(n.unit, t)}` : '';
}
function updateNewCardTotal(code_,baseUnit){
  const el=document.getElementById(`ptotal_${code_}`);
  const card=document.getElementById(`pcard_${code_}`);
  if(!el||!card) return;
  const val=fmt(baseUnit, getNewLocTotal(currentLoc, code_));
  el.textContent=val;
  el.className='product-total'+(val>0?'':' zero');
  card.classList.toggle('has-data', val>0);
  updateLocChipData(currentLocIdx); renderStats();
}
function refreshStdCard(pid,product,unitRules){
  const card=document.getElementById(`pcard_${pid}`);
  if(!card) return;
  const wasOpen=card.classList.contains('open');
  const meta = NOMENCLATURE.find(n=>OLD_TO_EXCEL[n.code]===pid) || null;
  const newCard=buildStdProductCard(product,unitRules,meta);
  if(wasOpen) newCard.classList.add('open');
  card.replaceWith(newCard);
  updateLocChipData(currentLocIdx); renderStats(); updateNavBadge();
  if(document.getElementById('tabSummary').classList.contains('active')) renderSummary();
}
function refreshNewCard(code_){
  const card=document.getElementById(`pcard_${code_}`);
  if(!card) return;
  const wasOpen=card.classList.contains('open');
  const n=NOMENCLATURE.find(x=>x.code===code_);
  if(!n) return;
  const newCard=buildNewProductCard(n);
  if(wasOpen) newCard.classList.add('open');
  card.replaceWith(newCard);
  updateLocChipData(currentLocIdx); renderStats(); updateNavBadge();
  if(document.getElementById('tabSummary').classList.contains('active')) renderSummary();
}
function refreshCustomCard(pid){
  const card=document.getElementById(`pcard_${pid}`);
  if(!card) return;

function toggleCustomUnitForm(body,loc,pid,isForCustomProduct){
  const existing=body.querySelector('.custom-form');
  if(existing){ existing.remove(); return; }
  const form=document.createElement('div');
  form.className='custom-form';
  form.innerHTML=`
    <div class="custom-form-title">➕ Новая единица</div>
    <input type="text" placeholder="Название (напр. коробка 10 кг)" id="cfLabel">
    <input type="number" step="any" inputmode="decimal" placeholder="Сколько базовых единиц" id="cfCoef">
    <div class="custom-form-btns">
      <button class="cf-save" id="cfSave">💾 Сохранить</button>
      <button class="cf-cancel" id="cfCancel">Отмена</button>
    </div>`;
  const footer=body.querySelector('.product-footer');
  body.insertBefore(form,footer);
  form.querySelector('#cfSave').onclick=()=>{
    const label=form.querySelector('#cfLabel').value.trim();
    const coef=parseFloat(form.querySelector('#cfCoef').value);
    if(!label || isNaN(coef) || coef<=0){ toast('⚠️ Введите корректные данные'); return; }
    if(isForCustomProduct){
      let cps=getCustomProducts(loc);
      const ci=cps.findIndex(p=>p.id===pid);
      if(ci!==-1){ if(!cps[ci].customUnits)cps[ci].customUnits=[]; cps[ci].customUnits.push({label,coefficient:coef,rows:[null]}); setCustomProducts(loc,cps); refreshCustomCard(pid); }
    } else {
      let cu=getCU(loc,pid); cu.push({label,coefficient:coef,rows:[null]}); setCU(loc,pid,cu);
      const product=stdProducts.find(p=>p.id===pid);
      refreshStdCard(pid,product,locationRules[loc]?.[pid]||[]);
    }
  };
  form.querySelector('#cfCancel').onclick=()=>form.remove();
  form.querySelector('#cfLabel').focus();
}

    ['meat',/мяс|куриц|курин|птиц|говядин|говяж|индейк|голен|крыл|филе|бекон|котлет|наггет|кревет|рыб|сосиск|колбас|ветчин/],
    ['veg',/картоф|овощ|лук|гриб|томат|помидор|огур|салат|руккол|зелень|морков|капуст|брокколи|кукуруз/],
    ['drinks',/напит|вода|чай|кофе|сироп|сок|коктейл|лимонад|милкшейк|молочн.*смес/],
    ['bakery',/булоч|хлеб|пирож|донат|маффин|чизкейк|тарт|печень|вафел|десерт|тортиль|торт|кекс|круассан|выпеч/],
    ['pantry',/сыр|молок|масл|мук|круп|сахар|яйц|паниров|кунжут|макарон|фасол|рис|кофейн/]
  ];
  for(const [group,pattern] of rules) if(pattern.test(value)) return group;
  return 'pantry';
}

function showAddProductForm(){
  const wrap=document.getElementById('addProductFormWrap');
  if(wrap.querySelector('.add-product-form')){ wrap.innerHTML=''; return; }
  const form=document.createElement('div');
  form.className='add-product-form';
  form.innerHTML=`
    <div class="add-product-form-title">🆕 Новый продукт для «${currentLoc}»</div>
    <input type="text" placeholder="Название продукта" id="apfName">
    <select id="apfUnit">
      <option value="шт">шт — штуки</option>
      <option value="кг">кг — килограммы</option>
      <option value="л">л — литры</option>
    </select>
    <select id="apfCategory" aria-label="Категория продукта">
      <option value="meat">Мясо / птица / полуфабрикаты</option><option value="veg">Овощи / картофель</option><option value="sauce">Соусы / специи</option><option value="drinks">Напитки / сиропы</option><option value="bakery">Выпечка / десерты</option><option value="pantry">Бакалея / сырьё</option><option value="pack">Упаковка / расходники</option><option value="promo">Промо</option>
    </select>
    <div class="add-product-form-btns">
      <button class="apf-save" id="apfSave">✅ Добавить</button>
      <button class="apf-cancel" id="apfCancel">Отмена</button>
    </div>`;
  wrap.innerHTML=''; wrap.appendChild(form);
  const nameInput=form.querySelector('#apfName');
  const categorySelect=form.querySelector('#apfCategory');
  nameInput.addEventListener('input',()=>{
    categorySelect.value=inferProductCategory(nameInput.value);
  });
  form.querySelector('#apfSave').onclick=()=>{
    const name=nameInput.value.trim();
    const baseUnit=form.querySelector('#apfUnit').value;
    const group=categorySelect.value;
    if(!name){ toast('⚠️ Введите название продукта'); return; }
    pushUndoSnapshot(`Добавление «${name}»`);
    const newProduct={id:genId(),name,baseUnit,group,rows:[null],customUnits:[]};
    let cps=getCustomProducts(currentLoc);
    cps.push(newProduct);
    setCustomProducts(currentLoc,cps);
    wrap.innerHTML='';
    renderProducts(); renderStats(); updateLocChipData(currentLocIdx); updateNavBadge();
    toast(`✅ Продукт «${name}» добавлен`);
    setTimeout(()=>{
      const newCard=document.getElementById(`pcard_${newProduct.id}`);
      if(newCard){ newCard.classList.add('open'); newCard.scrollIntoView({behavior:'smooth',block:'center'}); }
    },100);
  };
  form.querySelector('#apfCancel').onclick=()=>{ wrap.innerHTML=''; };
  nameInput.focus();
}

/* ═══════════════════════════════════════
   SUMMARY
═══════════════════════════════════════ */
function renderSummary(){
  const allRows=[];
  const mappedOldIds = new Set(Object.values(OLD_TO_EXCEL));

  // 1. Строго по NOMENCLATURE
  NOMENCLATURE.forEach(n=>{
    const oldId = OLD_TO_EXCEL[n.code];
    if (oldId) {
      const p = stdProducts.find(x=>x.id===oldId);
      if (!p) return;
      const total = locations.reduce((s,loc)=>s+getOldLocTotal(loc,oldId),0);
      const display = fmt(p.baseUnit, total);
      const detail = locations.filter(loc=>getOldLocs(oldId).includes(loc))
        .map(loc=>{ 
          const v = fmt(p.baseUnit, getOldLocTotal(loc,oldId)); 
          return v > 0 ? `${loc}: ${v}` : null; 
        })
        .filter(Boolean).join('\n');
      allRows.push({pid: oldId, name: n.name, unit: p.baseUnit, total: display, detail, isCustom: false, isOld: true, group:n.group});
    } else {
      const total = locations.reduce((s,loc)=>s+getNewLocTotal(loc,n.code),0);
      const display = fmt(n.unit, total);
      const detail = locations.filter(loc=>getNqLocs(n.code).includes(loc) && getNewLocTotal(loc,n.code)>0)
        .map(loc=>`${loc}: ${fmt(n.unit,getNewLocTotal(loc,n.code))}`)
        .join('\n');
      allRows.push({pid: n.code, name: n.name, unit: n.unit, total: display, detail, isCustom: false, isOld: false, group:n.group});
    }
  });

  // 2. Хвост (пиво, кеги)
  stdProducts.forEach(p=>{
    if (mappedOldIds.has(p.id)) return;
    const total = locations.reduce((s,loc)=>s+getOldLocTotal(loc,p.id),0);
    const display = fmt(p.baseUnit, total);
    const detail = locations.filter(loc=>getOldLocs(p.id).includes(loc))
      .map(loc=>{ 
        const v = fmt(p.baseUnit, getOldLocTotal(loc,p.id)); 
        return v > 0 ? `${loc}: ${v}` : null; 
      })
      .filter(Boolean).join('\n');
    allRows.push({pid: p.id, name: p.name, unit: p.baseUnit, total: display, detail, isCustom: false, isOld: true, group:({chicken:'meat',potato:'veg',mixes:'sauce',pantry:'pantry',beer:'drinks',containers:'pack'})[productCategory(p.id)]||'pantry'});
  });

  // 3. Кастомные
  const seenCp = new Set();
  locations.forEach(loc=>{
    getCustomProducts(loc).forEach(cp=>{
      if (seenCp.has(cp.id)) return;
      seenCp.add(cp.id);
      const total = getOldLocTotal(loc, cp.id);
      const display = fmt(cp.baseUnit, total);
      allRows.push({pid: cp.id, name: cp.name, unit: cp.baseUnit, total: display, detail: loc, isCustom: true, isOld: false, group:cp.group||'pantry'});
    });
  });

  const groupOrder=Object.keys(NOMENCLATURE_GROUPS);
  allRows.sort((a,b)=>{const ga=groupOrder.indexOf(a.group),gb=groupOrder.indexOf(b.group);const ca=ga<0?groupOrder.length:ga,cb=gb<0?groupOrder.length:gb;return ca-cb||a.name.localeCompare(b.name,'ru');});
  const filled = allRows.filter(r=>r.total>0).length;
  document.getElementById('summaryStats').innerHTML=`
    <div class="ss-card"><div class="ss-val">${allRows.length}</div><div class="ss-lbl">Всего позиций</div></div>
    <div class="ss-card"><div class="ss-val green">${filled}</div><div class="ss-lbl">Заполнено</div></div>
    <div class="ss-card"><div class="ss-val blue">${allRows.length?Math.round(filled/allRows.length*100):0}%</div><div class="ss-lbl">Готовность</div></div>
    <div class="ss-card"><div class="ss-val">${allRows.length-filled}</div><div class="ss-lbl">Пустых</div></div>`;

  let rows = allRows;
  if (searchQ) rows = rows.filter(r => r.name.toLowerCase().includes(searchQ.toLowerCase()));
  if (filterOnlyFilled) rows = rows.filter(r => r.total > 0);

  const list = document.getElementById('summaryList');
  list.innerHTML='';
  if (rows.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="ei">🔍</div><p>Ничего не найдено</p></div>`;
    return;
  }

  rows.forEach(r => {
    const item = document.createElement('div');
    item.className = 'sum-item' + (r.total===0 ? ' zero' : '') + (r.isCustom ? ' custom' : '');
    item.innerHTML = `
      <div class="sum-item-left">
        <div class="sum-item-name">
          ${r.name}
          ${r.isCustom ? ' <span style="font-size:10px;color:var(--warning);background:var(--warning-subtle);padding:1px 6px;border-radius:10px;font-weight:700;">свой</span>' : ''}
          ${r.isOld ? ' <span style="font-size:10px;color:var(--text-tertiary);background:var(--border-light);padding:1px 6px;border-radius:10px;font-weight:700;">старая</span>' : ''}
        </div>
        ${r.detail ? `<div class="sum-item-detail">${r.detail.replace(/\n/g,'<br>')}</div>` : ''}
      </div>
      <div class="sum-item-right">
        <div class="sum-item-val ${r.total===0 ? 'zero' : ''}">${r.total}</div>
        <div class="sum-item-unit">${r.unit}</div>
      </div>`;
    list.appendChild(item);
  });
}

/* ═══════════════════════════════════════
   CLEAR / RESET
═══════════════════════════════════════ */
function clearLocation(){
  showConfirm(`Очистить все данные для "${currentLoc}"?`,()=>{
    pushUndoSnapshot(`Очистка помещения «${currentLoc}»`);
    stdProducts.forEach(p=>{
      const rules=locationRules[currentLoc]?.[p.id];
      if(rules) rules.forEach((_,uIdx)=>setRows(currentLoc,p.id,uIdx,[null]));
      setCU(currentLoc,p.id,[]);
    });
    NOMENCLATURE.forEach(n=>{
      if(OLD_TO_EXCEL[n.code]) return;
      if(!getNqLocs(n.code).includes(currentLoc)) return;
      setNqRows(n.code, currentLoc, 0, [null]);
      (n.units||[]).forEach((_,i)=>setNqRows(n.code, currentLoc, i+1, [null]));
    });
    let cps=getCustomProducts(currentLoc);
    cps.forEach(cp=>{ cp.rows=[null]; (cp.customUnits||[]).forEach(unit=>{unit.rows=[null];}); });
    setCustomProducts(currentLoc,cps);
    document.getElementById('addProductFormWrap').innerHTML='';
    renderLocStrip(); renderStats(); renderProducts(); updateNavBadge();
    toast('🧹 Помещение очищено');
  });
}
function fullReset(){
  showConfirm('⚠️ Удалить ВСЕ данные по всем помещениям?',()=>{
    pushUndoSnapshot('Полный сброс');
    locations.forEach(loc=>{
      stdProducts.forEach(p=>{
        const rules=locationRules[loc]?.[p.id];
        if(rules) rules.forEach((_,uIdx)=>setRows(loc,p.id,uIdx,[null]));
        getCU(loc,p.id).forEach(unit=>{unit.rows=[null];});
       setCU(loc,p.id,getCU(loc,p.id));
      });
      let custom=getCustomProducts(loc);custom.forEach(cp=>{cp.rows=[null];(cp.customUnits||[]).forEach(unit=>{unit.rows=[null];});});setCustomProducts(loc,custom);
    });
    NOMENCLATURE.forEach(n=>{
      if(OLD_TO_EXCEL[n.code]) return;
      locations.forEach(loc=>{
        setNqRows(n.code, loc, 0, [null]);
        (n.units||[]).forEach((_,i)=>setNqRows(n.code, loc, i+1, [null]));
      });
    });
    document.getElementById('addProductFormWrap').innerHTML='';
    renderLocStrip(); renderStats(); renderProducts(); updateNavBadge();
    if(document.getElementById('tabSummary').classList.contains('active')) renderSummary();
    toast('🗑️ Все данные удалены');
  });
}

/* ═══════════════════════════════════════
   TABS
═══════════════════════════════════════ */
function switchTab(tab){
  document.querySelectorAll('.tab-view').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('appBody').scrollTop=0;
  if(tab==='inventory'){
    document.getElementById('tabInventory').classList.add('active');
    document.getElementById('navInventory').classList.add('active');
    document.getElementById('quickAddFab').style.display='flex';
  } else if(tab==='summary'){
    document.getElementById('tabSummary').classList.add('active');
    document.getElementById('navSummary').classList.add('active');
    document.getElementById('quickAddFab').style.display='none';
    renderSummary();
  }
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init(){
  renderLocStrip(); renderStats(); renderCategoryStrip(); renderProducts(); updateNavBadge();
  updateUndoButton();

  document.getElementById('clearLocBtn').onclick=clearLocation;
  document.getElementById('hardResetBtn').onclick=fullReset;
  document.getElementById('addProductBtn').onclick=showAddProductForm;
  document.getElementById('quickAddFab').onclick=()=>{
    switchTab('inventory');
    document.getElementById('appBody').scrollTop=0;
    showAddProductForm();
    setTimeout(()=>{
      const inp=document.getElementById('apfName');
      if(inp){ inp.focus(); inp.scrollIntoView({behavior:'smooth',block:'center'}); }
    },100);
  };
  document.getElementById('undoBtn').onclick=undoLastAction;

  document.getElementById('confirmOkBtn').onclick=()=>{
    const cb=_confirmCallback;
    hideConfirm();
    if(cb) cb();
  };
  document.getElementById('confirmCancelBtn').onclick=hideConfirm;

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.onclick=()=>switchTab(btn.dataset.tab);
  });

  const invSearch=document.getElementById('invSearchInput');
  const invClear=document.getElementById('invSearchClear');
  invSearch.oninput=e=>{
    invSearchQ=e.target.value;
    invClear.classList.toggle('visible', invSearchQ.length>0);
    renderProducts();
  };
  invClear.onclick=()=>{
    invSearchQ=''; invSearch.value='';
    invClear.classList.remove('visible');
    renderProducts();
  };

  document.getElementById('searchInput').oninput=e=>{ searchQ=e.target.value; renderSummary(); };

  const btnAll=document.getElementById('filterAllBtn');
  const btnFilled=document.getElementById('filterFilledBtn');
  btnAll.onclick=()=>{ filterOnlyFilled=false; btnAll.classList.add('active'); btnFilled.classList.remove('active'); renderSummary(); };
  btnFilled.onclick=()=>{ filterOnlyFilled=true; btnFilled.classList.add('active'); btnAll.classList.remove('active'); renderSummary(); };

  const appBody=document.getElementById('appBody');
  const scrollTopFab=document.getElementById('scrollTopFab');
  appBody.addEventListener('scroll',()=>{ scrollTopFab.classList.toggle('visible', appBody.scrollTop>200); },{passive:true});
  scrollTopFab.onclick=()=>appBody.scrollTo({top:0,behavior:'smooth'});
}

init();

})();
